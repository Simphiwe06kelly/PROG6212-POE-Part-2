name: Part 2 API CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -f RaceDay.API.slnx
          test -f RaceDay.API/RaceDay.Api.csproj
          test -f RaceDay.Api.Tests/RaceDay.Api.Tests.csproj
          test -d RaceDay.API/Controllers
          test -d RaceDay.API/Models
          test -d RaceDay.API/Migrations

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build
        run: dotnet build RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-build --configuration Release --verbosity normal
